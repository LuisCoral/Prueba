<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira la magia</title>
  <meta name="theme-color" content="#FFD23F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFD23F;
      --ink: #1B1340;
      --magenta: #E4308C;
      --teal: #19C3B1;
      --paper: #FFF6D6;
      --display: "Bowlby One", "Arial Black", Impact, sans-serif;
      --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      font-family: var(--body);
      color: var(--ink);
      background-color: var(--sun);
      background-image: radial-gradient(rgba(27, 19, 64, .12) 2px, transparent 2px);
      background-size: 28px 28px;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1.5rem 5rem;
      overflow: hidden;
    }

    .stage { position: relative; display: grid; place-items: center; }

    /* ---------- El botón ---------- */
    .magic {
      width: min(76vw, 320px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 5px solid var(--ink);
      background: var(--magenta);
      color: #fff;
      font-family: var(--display);
      font-size: clamp(1.45rem, 6.2vw, 2rem);
      line-height: 1.12;
      padding: 1.6rem;
      cursor: pointer;
      box-shadow: 0 10px 0 var(--ink);
      transition: transform .08s ease, box-shadow .08s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .magic:hover { background: #ee3d97; }
    .magic:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); }
    .magic:focus-visible { outline: 5px solid var(--teal); outline-offset: 6px; }

    /* ---------- Mensaje ---------- */
    .reveal {
      position: absolute;
      top: 100%;
      left: 50%;
      translate: -50% 0;
      width: min(92vw, 440px);
      margin-top: 2.2rem;
      display: flex;
      justify-content: center;
      min-height: 7rem;
    }
    .greeting {
      margin: 0;
      text-align: center;
      font-family: var(--display);
      font-size: clamp(1.4rem, 6vw, 2rem);
      line-height: 1.2;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 18px;
      padding: .7rem 1.1rem;
      box-shadow: 0 6px 0 var(--ink);
      rotate: -2deg;
      animation: pop .35s cubic-bezier(.2, 1.6, .4, 1);
    }
    @keyframes pop {
      from { transform: scale(.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ---------- Corazones ---------- */
    .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 1.5rem;
      line-height: 1;
      pointer-events: none;
      animation: fly 1s ease-out forwards;
    }
    @keyframes fly {
      from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity: 0; }
    }

    /* ---------- Menú secreto ---------- */
    dialog {
      width: min(92vw, 420px);
      max-height: 80dvh;
      padding: 0;
      border: 5px solid var(--ink);
      border-radius: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      overflow: hidden;
    }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgba(27, 19, 64, .6); }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 4px solid var(--ink);
      background: var(--teal);
    }
    .sheet-head h2 { margin: 0; font-family: var(--display); font-size: 1.2rem; font-weight: 400; }
    .close {
      width: 40px; height: 40px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
    }
    .close:focus-visible, .clear:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; }

    #logWrap { overflow-y: auto; flex: 1; }
    .log { list-style: none; margin: 0; padding: .75rem 1.25rem; }
    .log li { padding: .7rem 0; border-bottom: 2px dashed rgba(27, 19, 64, .25); }
    .log li:last-child { border-bottom: 0; }
    .log .who { font-family: var(--display); font-size: 1.15rem; word-break: break-all; }
    .log .meta { display: block; margin-top: .15rem; font-size: .9rem; font-weight: 600; opacity: .8; }
    .empty { padding: 1.5rem 1.25rem; margin: 0; font-weight: 600; }

    .sheet-foot { padding: .8rem 1.25rem 1rem; border-top: 4px solid var(--ink); }
    .sheet-foot p { margin: 0 0 .6rem; font-size: .85rem; font-weight: 600; opacity: .8; }
    .clear {
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--sun);
      color: var(--ink);
      font-family: var(--body);
      font-weight: 800;
      font-size: .95rem;
      padding: .5rem 1rem;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .spark { display: none; }
      .greeting { animation: none; }
    }
  </style>
</head>
<body>

  <main>
    <div class="stage" id="stage">
      <button class="magic" id="magicBtn" type="button">Presiona el botón y mira la magia</button>
      <div class="reveal" id="reveal" aria-live="polite"></div>
    </div>
  </main>

  <dialog id="menu" aria-labelledby="menuTitle">
    <div class="sheet-head">
      <h2 id="menuTitle">¿Quién presionó el botón?</h2>
      <button class="close" id="closeBtn" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div id="logWrap"></div>
    <div class="sheet-foot">
      <p>Este registro se guarda solo en este navegador.</p>
      <button class="clear" id="clearBtn" type="button">Borrar registro</button>
    </div>
  </dialog>

  <script>
    (function () {
      var STORAGE_KEY = "magia-registro";
      var HOLD_MS = 5000; // tiempo que hay que mantener presionado el botón para abrir el menú

      var magicBtn = document.getElementById("magicBtn");
      var stage = document.getElementById("stage");
      var reveal = document.getElementById("reveal");
      var menu = document.getElementById("menu");
      var logWrap = document.getElementById("logWrap");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ---------- Registro (localStorage, con protección) ---------- */
      function readLog() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch (e) { return []; }
      }
      function writeLog(list) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
      }

      /* ---------- Dispositivo ---------- */
      function deviceLabel() {
        var ua = navigator.userAgent;
        var os = /Android/i.test(ua) ? "Android"
          : /iPhone|iPad|iPod/i.test(ua) ? "iPhone/iPad"
          : /Windows/i.test(ua) ? "Windows"
          : /Mac OS X/i.test(ua) ? "Mac"
          : /Linux/i.test(ua) ? "Linux" : "Dispositivo desconocido";
        var br = /Edg\//.test(ua) ? "Edge"
          : /OPR\/|Opera/.test(ua) ? "Opera"
          : /Chrome\/|CriOS/.test(ua) ? "Chrome"
          : /Firefox\/|FxiOS/.test(ua) ? "Firefox"
          : /Safari\//.test(ua) ? "Safari" : "navegador";
        return os + ", " + br;
      }

      /* ---------- Obtener la IP (no pide ningún permiso) ---------- */
      async function fetchIP() {
        var urls = [
          "https://api.ipify.org?format=json",
          "https://api64.ipify.org?format=json",
          "https://ipapi.co/json/"
        ];
        for (var i = 0; i < urls.length; i++) {
          try {
            var ctrl = new AbortController();
            var timer = setTimeout(function () { ctrl.abort(); }, 5000);
            var res = await fetch(urls[i], { signal: ctrl.signal });
            clearTimeout(timer);
            if (!res.ok) continue;
            var data = await res.json();
            if (data && data.ip) return data.ip;
          } catch (e) { /* probar con el siguiente servicio */ }
        }
        return null;
      }

      /* ---------- Guardar la pulsación en silencio ---------- */
      async function recordPress() {
        var time = new Date().toISOString();
        var ip = await fetchIP();
        var list = readLog();
        list.unshift({ ip: ip || "No disponible", time: time, device: deviceLabel() });
        writeLog(list.slice(0, 100));
      }

      /* ---------- Corazones ---------- */
      function burst() {
        if (reduceMotion) return;
        var hearts = ["❤️", "💛", "💖", "🧡", "💜"];
        for (var i = 0; i < 16; i++) {
          var s = document.createElement("span");
          var angle = Math.random() * Math.PI * 2;
          var dist = 130 + Math.random() * 130;
          s.className = "spark";
          s.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
          s.addEventListener("animationend", function () { this.remove(); });
          stage.appendChild(s);
        }
      }

      function showGreeting() {
        reveal.innerHTML = "";
        var p = document.createElement("p");
        p.className = "greeting";
        p.textContent = "¡Feliz día del amor y la amistad!";
        reveal.appendChild(p);
      }

      /* ---------- Menú secreto ---------- */
      var menuOpenedAt = 0;

      function renderLog() {
        var list = readLog();
        logWrap.innerHTML = "";
        if (!list.length) {
          var p = document.createElement("p");
          p.className = "empty";
          p.textContent = "Todavía nadie presionó el botón en este navegador.";
          logWrap.appendChild(p);
          return;
        }
        var ul = document.createElement("ul");
        ul.className = "log";
        list.forEach(function (item) {
          var li = document.createElement("li");
          var who = document.createElement("span");
          who.className = "who";
          who.textContent = item.ip;
          var meta = document.createElement("span");
          meta.className = "meta";
          var when = new Date(item.time).toLocaleString("es", { dateStyle: "medium", timeStyle: "short" });
          meta.textContent = when + " — " + item.device;
          li.appendChild(who);
          li.appendChild(meta);
          ul.appendChild(li);
        });
        logWrap.appendChild(ul);
      }

      function openMenu() {
        renderLog();
        menuOpenedAt = Date.now();
        try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
        if (!menu.open) menu.showModal();
      }

      /* ---------- Mantener presionado 5 s = abrir menú ---------- */
      var holdTimer = null;
      var holdTriggered = false;

      function startHold(e) {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        holdTriggered = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(function () {
          holdTriggered = true;
          openMenu();
        }, HOLD_MS);
      }
      function cancelHold() { clearTimeout(holdTimer); }

      magicBtn.addEventListener("pointerdown", startHold);
      magicBtn.addEventListener("pointerup", cancelHold);
      magicBtn.addEventListener("pointerleave", cancelHold);
      magicBtn.addEventListener("pointercancel", cancelHold);
      magicBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      /* ---------- Toque normal ---------- */
      magicBtn.addEventListener("click", function () {
        // Si el toque fue la pulsación larga que abrió el menú, no mostrar el saludo
        if (holdTriggered) { holdTriggered = false; return; }
        showGreeting();
        burst();
        recordPress();
      });

      /* ---------- Controles del menú ---------- */
      document.getElementById("closeBtn").addEventListener("click", function () { menu.close(); });
      document.getElementById("clearBtn").addEventListener("click", function () {
        writeLog([]);
        renderLog();
      });
      menu.addEventListener("click", function (e) {
        if (e.target === menu && Date.now() - menuOpenedAt > 400) menu.close();
      });
    })();
  </script>
</body>
</html>
